name: Release binary

# When a release is published: build the Linux x86_64 binary on the oldest supported runner
# (so it runs on that glibc/GTK and newer) and the Windows x86_64 exe, then attach both with one
# SHA256SUMS. install.sh / install.ps1 download these when cargo is not installed.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Version matches the tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test "v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)" = "$TAG"
      - run: cargo test --locked --release
      - run: cargo build --locked --release
      - run: mkdir dist && cp target/release/repo-status dist/repo-status-x86_64-linux
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: dist/repo-status-x86_64-linux
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Version matches the tag
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test "v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)" = "$TAG"
      - run: cargo test --locked --release
      - run: cargo build --locked --release
      - shell: bash
        run: mkdir dist && cp target/release/repo-status.exe dist/repo-status-x86_64-windows.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/repo-status-x86_64-windows.exe
          if-no-files-found: error

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # upload the release assets
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum repo-status-x86_64-linux repo-status-x86_64-windows.exe > SHA256SUMS && cat SHA256SUMS
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" dist/repo-status-x86_64-linux dist/repo-status-x86_64-windows.exe dist/SHA256SUMS \
            --clobber --repo "$GITHUB_REPOSITORY"
