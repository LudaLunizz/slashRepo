description = "Open the Repo Status window (releases, CI, PRs, issues)"
prompt = """
!{if [ -x "$HOME/.local/bin/repo-status" ]; then setsid -f "$HOME/.local/bin/repo-status" >/dev/null 2>&1 </dev/null; echo "Repo Status window opened."; elif [ -n "${SLASHREPO_TRIGGER:-}" ] && date > "$SLASHREPO_TRIGGER" 2>/dev/null; then echo "Repo Status window opened (through the trigger file)."; else echo "repo-status is not reachable from here (not installed, or a sandbox hides it)."; fi}
The line above comes from this command. Reply with exactly that one line and nothing else. Do not run anything.
"""
