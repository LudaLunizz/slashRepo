<svg xmlns="http://www.w3.org/2000/svg" width="860" height="650" viewBox="0 0 860 650" font-family="DejaVu Sans, Verdana, sans-serif">
  <title>The Repo Status window (example data)</title>
  <rect width="860" height="650" rx="14" fill="#1c2128" stroke="#444c56" stroke-width="2"/>
  <path d="M0 14a14 14 0 0 1 14-14h832a14 14 0 0 1 14 14v34H0z" fill="#2d333b"/>
  <rect x="14" y="14" width="86" height="24" rx="6" fill="#444c56"/>
  <text x="57" y="31" font-size="13" fill="#adbac7" text-anchor="middle">Refresh</text>
  <text x="430" y="31" font-size="15" font-weight="bold" fill="#cdd9e5" text-anchor="middle">Repo Status</text>
  <rect x="760" y="14" width="86" height="24" rx="6" fill="#444c56"/>
  <text x="803" y="31" font-size="13" fill="#adbac7" text-anchor="middle">New tab</text>
  <text x="24" y="70" font-size="11" fill="#768390">checked 09:41 — 5 repos in 2 tab(s)</text>
  <text x="30" y="102" font-size="13" fill="#e5534b">●</text>
  <text x="46" y="102" font-size="14" fill="#cdd9e5">My repos</text>
  <rect x="24" y="110" width="104" height="3" fill="#539bf5"/>
  <text x="152" y="102" font-size="13" fill="#57ab5a">●</text>
  <text x="168" y="102" font-size="14" fill="#768390">Friends</text>
  <rect x="20" y="126" width="500" height="28" rx="6" fill="#22272e" stroke="#444c56"/>
  <text x="30" y="145" font-size="13" fill="#768390">owner/name or GitHub link</text>
  <rect x="530" y="126" width="90" height="28" rx="6" fill="#444c56"/>
  <text x="575" y="145" font-size="13" fill="#adbac7" text-anchor="middle">Add repo</text>
  <rect x="630" y="126" width="100" height="28" rx="6" fill="#444c56"/>
  <text x="680" y="145" font-size="13" fill="#adbac7" text-anchor="middle">My order ▾</text>
  <rect x="740" y="126" width="100" height="28" rx="6" fill="#444c56"/>
  <text x="790" y="145" font-size="13" fill="#adbac7" text-anchor="middle">Remove tab</text>
  <g transform="translate(0 84)">

  <rect x="20" y="88" width="820" height="130" rx="8" fill="#22272e" stroke="#444c56"/>
  <text x="760" y="116" font-size="13" fill="#768390">▲   ▼   ✕</text>
  <text x="38" y="116" font-size="16" fill="#57ab5a">●</text>
  <text x="62" y="116" font-size="15" font-weight="bold" fill="#539bf5">you/rocket-launcher</text>
  <text x="62" y="138" font-size="11" fill="#768390">release: v1.4.2, 3d ago   |   main CI: success   |   last push 3d ago   |   ★ 312  forks 40</text>
  <text x="62" y="186" font-size="14" font-weight="bold" fill="#cdd9e5">→ nothing to do</text>

  <rect x="20" y="230" width="820" height="170" rx="8" fill="#22272e" stroke="#444c56"/>
  <text x="760" y="258" font-size="13" fill="#768390">▲   ▼   ✕</text>
  <text x="38" y="258" font-size="16" fill="#d29922">●</text>
  <text x="62" y="258" font-size="15" font-weight="bold" fill="#539bf5">you/tiny-parser</text>
  <text x="62" y="280" font-size="11" fill="#768390">release: v0.9.0, 12d ago   |   main CI: success   |   last push today   |   ★ 58  forks 7</text>
  <text x="62" y="304" font-size="13" fill="#adbac7">   PR #17 Support trailing commas  [checks success, by a-friend]</text>
  <text x="62" y="324" font-size="13" fill="#adbac7">   issue #14 Crash on empty input  (6d ago) [bug]</text>
  <text x="62" y="352" font-size="14" font-weight="bold" fill="#cdd9e5">→ PR #17 is green: review / merge</text>
  <text x="62" y="374" font-size="14" font-weight="bold" fill="#cdd9e5">→ 4 commit(s) on main since v0.9.0: release when ready</text>

  <rect x="20" y="412" width="820" height="128" rx="8" fill="#22272e" stroke="#444c56"/>
  <text x="760" y="440" font-size="13" fill="#768390">▲   ▼   ✕</text>
  <text x="38" y="440" font-size="16" fill="#e5534b">●</text>
  <text x="62" y="440" font-size="15" font-weight="bold" fill="#539bf5">you/old-website</text>
  <text x="62" y="462" font-size="11" fill="#768390">release: no releases   |   main CI: failure   |   last push 41d ago   |   ★ 2  forks 0</text>
  <text x="62" y="494" font-size="14" font-weight="bold" fill="#cdd9e5">→ CI is red on main: fix first</text>
  <text x="62" y="516" font-size="14" font-weight="bold" fill="#cdd9e5">→ 2 open Dependabot security alert(s)</text>
  </g>
</svg>
