<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" font-family="DejaVu Sans, Verdana, sans-serif">
  <title>How /repo works: a script does the work, Claude only says one line</title>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#768390"/></marker></defs>
  <rect width="860" height="300" rx="14" fill="#1c2128"/>

  <rect x="20" y="40" width="150" height="90" rx="10" fill="#2d333b" stroke="#539bf5" stroke-width="2"/>
  <text x="95" y="76" font-size="13" fill="#768390" text-anchor="middle">you type</text>
  <text x="95" y="108" font-size="26" font-weight="bold" fill="#cdd9e5" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">/repo</text>

  <rect x="240" y="40" width="150" height="90" rx="10" fill="#2d333b" stroke="#57ab5a" stroke-width="2"/>
  <text x="315" y="72" font-size="13" fill="#768390" text-anchor="middle">tiny hook</text>
  <text x="315" y="96" font-size="12" fill="#cdd9e5" text-anchor="middle">sees "/repo",</text>
  <text x="315" y="114" font-size="12" fill="#cdd9e5" text-anchor="middle">starts the script</text>

  <rect x="460" y="40" width="170" height="90" rx="10" fill="#2d333b" stroke="#57ab5a" stroke-width="2"/>
  <text x="545" y="72" font-size="13" fill="#768390" text-anchor="middle">repo-status</text>
  <text x="545" y="96" font-size="12" fill="#cdd9e5" text-anchor="middle">asks GitHub via gh,</text>
  <text x="545" y="114" font-size="12" fill="#cdd9e5" text-anchor="middle">read-only</text>

  <rect x="700" y="40" width="140" height="90" rx="10" fill="#2d333b" stroke="#d29922" stroke-width="2"/>
  <text x="770" y="72" font-size="13" fill="#768390" text-anchor="middle">your screen</text>
  <text x="770" y="96" font-size="12" fill="#cdd9e5" text-anchor="middle">the Repo Status</text>
  <text x="770" y="114" font-size="12" fill="#cdd9e5" text-anchor="middle">window pops up</text>

  <path d="M172 85H236" stroke="#768390" stroke-width="2" marker-end="url(#a)"/><path d="M392 85H456" stroke="#768390" stroke-width="2" marker-end="url(#a)"/><path d="M632 85H696" stroke="#768390" stroke-width="2" marker-end="url(#a)"/>

  <rect x="20" y="170" width="820" height="110" rx="10" fill="#22272e" stroke="#444c56"/>
  <text x="46" y="206" font-size="13" fill="#768390">Meanwhile, Claude</text>
  <text x="46" y="238" font-size="15" fill="#cdd9e5">replies one line: “Repo Status window opened.” and never sees your repos.</text>
  <text x="46" y="264" font-size="12" fill="#768390">The report is not written, read or summarised by the model.</text>
  <rect x="640" y="186" width="180" height="78" rx="10" fill="#1c2128" stroke="#57ab5a" stroke-width="2"/>
  <text x="730" y="232" font-size="38" font-weight="bold" fill="#57ab5a" text-anchor="middle">0</text>
  <text x="730" y="254" font-size="12" fill="#adbac7" text-anchor="middle">tokens for the info</text>
</svg>
