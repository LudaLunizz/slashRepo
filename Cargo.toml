[package]
name = "slashrepo"
version = "0.6.4"
edition = "2024"
rust-version = "1.92"
description = "/repo for coding agents: a window with where each of your repos stands (release, CI, PRs, issues, to-dos)"
license = "MIT"
repository = "https://github.com/LudaLunizz/slashRepo"
publish = false

[[bin]]
name = "repo-status"
path = "src/main.rs"

[dependencies]
regex = { version = "1", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
# preserve_order: editing ~/.claude/settings.json must keep the user's key order.
serde_json = { version = "1", features = ["preserve_order"] }

# Linux (and other Unix): the GTK 4 window, rustls for HTTPS.
[target.'cfg(not(windows))'.dependencies]
# v4_12: CssProvider::load_from_string; UriLauncher and AlertDialog are 4.10.
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }

# Windows: an egui window drawn with wgpu (Direct3D 12, or WARP without a GPU), so the .exe needs
# no runtime; HTTPS through the Windows TLS stack (schannel) and its certificate store.
[target.'cfg(windows)'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "links", "wgpu"] }
png = "0.18"
ureq = { version = "3", default-features = false, features = ["native-tls-no-default"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_SystemInformation", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
# the icon and version info inside repo-status.exe (only used when building for Windows on Windows)
winresource = { version = "0.1", default-features = false }

[profile.release]
overflow-checks = true
lto = "thin"
strip = true

[lints.rust]
# deny, not forbid: src/win.rs needs two console calls (each marked)
unsafe_code = "deny"

[lints.clippy]
mem_forget = "deny"
